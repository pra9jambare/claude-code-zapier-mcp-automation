<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="claude" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="openrouter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="deepseek" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="zapier" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="apps" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowRightGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold" font-family="'SF Pro', 'Segoe UI', sans-serif">AI-Powered Cross-Platform Automation Stack</text>
  <text x="550" y="58" text-anchor="middle" fill="#64748b" font-size="11" font-family="'SF Pro', 'Segoe UI', sans-serif">Claude Code → OpenRouter → DeepSeek V4 Flash → Zapier MCP → 7,000+ Apps</text>

  <!-- Layer 1: Local Machine -->
  <rect x="50" y="85" width="1000" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="105" fill="#94a3b8" font-size="9" font-weight="bold" letter-spacing="1.5">LAYER 1</text>
  <text x="70" y="120" fill="#475569" font-size="8">macOS / Linux / Windows</text>
  <text x="550" y="105" text-anchor="middle" fill="#64748b" font-size="10">🌐 Your Local Machine</text>

  <!-- Claude Code Box -->
  <rect x="200" y="100" width="180" height="50" rx="6" fill="url(#claude)" filter="url(#glow)"/>
  <text x="290" y="122" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Claude Code CLI</text>
  <text x="290" y="138" text-anchor="middle" fill="#c7d2fe" font-size="8">Terminal Agent (npm)</text>

  <!-- Arrow from Claude to OpenRouter -->
  <line x1="380" y1="125" x2="470" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arrowRight)" stroke-dasharray="4,3"/>

  <!-- Layer 2: Model Routing -->
  <rect x="50" y="195" width="1000" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="215" fill="#94a3b8" font-size="9" font-weight="bold" letter-spacing="1.5">LAYER 2</text>
  <text x="550" y="215" text-anchor="middle" fill="#64748b" font-size="10">🧠 Model Routing &amp; Inference</text>

  <!-- OpenRouter Box -->
  <rect x="200" y="210" width="180" height="50" rx="6" fill="url(#openrouter)" filter="url(#glow)"/>
  <text x="290" y="232" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">OpenRouter Gateway</text>
  <text x="290" y="248" text-anchor="middle" fill="#fef3c7" font-size="8">200+ LLM Router</text>

  <!-- Arrow OpenRouter to DeepSeek -->
  <line x1="380" y1="235" x2="470" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- DeepSeek Box -->
  <rect x="480" y="210" width="180" height="50" rx="6" fill="url(#deepseek)" filter="url(#glow)"/>
  <text x="570" y="232" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">DeepSeek V4 Flash</text>
  <text x="570" y="248" text-anchor="middle" fill="#d1fae5" font-size="8">Inference Engine</text>

  <!-- Swap models indicator -->
  <text x="760" y="235" fill="#475569" font-size="8" font-style="italic">(Swap: Claude, GPT, Gemini...)</text>

  <!-- Arrow down to Layer 3 -->
  <line x1="550" y1="275" x2="550" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- Layer 3: MCP Protocol -->
  <rect x="50" y="310" width="1000" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="330" fill="#94a3b8" font-size="9" font-weight="bold" letter-spacing="1.5">LAYER 3</text>
  <text x="550" y="330" text-anchor="middle" fill="#64748b" font-size="10">🔌 MCP Protocol Layer</text>

  <!-- Zapier MCP Box -->
  <rect x="350" y="325" width="200" height="50" rx="6" fill="url(#zapier)" filter="url(#glow)"/>
  <text x="450" y="347" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Zapier MCP Server</text>
  <text x="450" y="363" text-anchor="middle" fill="#fee2e2" font-size="8">Model Context Protocol Bridge</text>

  <!-- Arrow down to Layer 4 -->
  <line x1="550" y1="390" x2="550" y2="415" stroke="#64748b" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- Layer 4: Connected Apps -->
  <rect x="50" y="425" width="1000" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="445" fill="#94a3b8" font-size="9" font-weight="bold" letter-spacing="1.5">LAYER 4</text>
  <text x="550" y="445" text-anchor="middle" fill="#64748b" font-size="10">📱 Connected Applications (OAuth 2.0)</text>

  <!-- Gmail Box -->
  <rect x="80" y="460" width="180" height="70" rx="6" fill="url(#apps)" filter="url(#glow)"/>
  <text x="170" y="485" text-anchor="middle" fill="#fff" font-size="14">📧</text>
  <text x="170" y="502" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Gmail</text>
  <text x="170" y="518" text-anchor="middle" fill="#bfdbfe" font-size="8">Read · Send · CC · Search</text>

  <!-- LinkedIn Box -->
  <rect x="320" y="460" width="180" height="70" rx="6" fill="url(#apps)" filter="url(#glow)"/>
  <text x="410" y="485" text-anchor="middle" fill="#fff" font-size="14">💼</text>
  <text x="410" y="502" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">LinkedIn</text>
  <text x="410" y="518" text-anchor="middle" fill="#bfdbfe" font-size="8">Profile · Post · Company Updates</text>

  <!-- GitHub Box -->
  <rect x="560" y="460" width="180" height="70" rx="6" fill="url(#apps)" filter="url(#glow)"/>
  <text x="650" y="485" text-anchor="middle" fill="#fff" font-size="14">🐙</text>
  <text x="650" y="502" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">GitHub</text>
  <text x="650" y="518" text-anchor="middle" fill="#bfdbfe" font-size="8">Repos · Issues · PRs · Files</text>

  <!-- 7000+ Apps Box -->
  <rect x="800" y="460" width="220" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="910" y="485" text-anchor="middle" fill="#64748b" font-size="20">+</text>
  <text x="910" y="502" text-anchor="middle" fill="#64748b" font-size="11" font-weight="bold">7,000+ More Apps</text>
  <text x="910" y="518" text-anchor="middle" fill="#475569" font-size="8">Slack · Notion · Jira · Drive · Sheets...</text>

  <!-- Bottom: Output/Result -->
  <rect x="50" y="575" width="1000" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="595" fill="#94a3b8" font-size="9" font-weight="bold" letter-spacing="1.5">OUTPUT</text>
  <text x="550" y="595" text-anchor="middle" fill="#64748b" font-size="10">🎯 Real Results Achieved</text>

  <!-- Result boxes -->
  <rect x="80" y="610" width="290" height="70" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="225" y="632" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">✅ Gmail Actions</text>
  <text x="225" y="648" text-anchor="middle" fill="#64748b" font-size="9">• Scanned 21 inbox emails</text>
  <text x="225" y="662" text-anchor="middle" fill="#64748b" font-size="9">• Sent email with CC support</text>

  <rect x="405" y="610" width="290" height="70" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="550" y="632" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">✅ LinkedIn Actions</text>
  <text x="550" y="648" text-anchor="middle" fill="#64748b" font-size="9">• Profile verified via API</text>
  <text x="550" y="662" text-anchor="middle" fill="#64748b" font-size="9">• Post published to feed</text>

  <rect x="730" y="610" width="290" height="70" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="875" y="632" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">✅ GitHub Actions</text>
  <text x="875" y="648" text-anchor="middle" fill="#64748b" font-size="9">• Created repository</text>
  <text x="875" y="662" text-anchor="middle" fill="#64748b" font-size="9">• Pushed README + assets</text>

  <!-- Legend -->
  <text x="70" y="710" fill="#475569" font-size="8">🔒 All connections use OAuth 2.0 — no passwords or API keys exposed in transit</text>
  <text x="550" y="710" text-anchor="middle" fill="#475569" font-size="8">⚡ Created with Claude Code + DeepSeek V4 Flash via OpenRouter + Zapier MCP</text>
</svg>